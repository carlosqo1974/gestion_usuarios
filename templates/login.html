<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso — Gestión AD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { width: 100%; max-width: 400px; }
    .login-logo img { max-height: 64px; width: auto; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="card shadow-sm border-0">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <div class="login-logo mb-3">
            <img src="https://contactamericas.com/assets/logo-xaubT1yS.png" alt="Contact Americas" />
          </div>
          <h5 class="fw-bold text-secondary">Gestión de Usuarios AD</h5>
          <p class="text-muted small">Acceso restringido a miembros de <strong>{{ admin_groups | join(', ') }}</strong></p>
        </div>

        {% if error %}
        <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" autocomplete="off">
          <div class="mb-3">
            <label class="form-label fw-semibold">Usuario de dominio</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" name="username" class="form-control"
                     placeholder="nombre.apellido" autofocus
                     value="{{ request.form.get('username', '') }}" required />
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control"
                     placeholder="Contraseña de dominio" required />
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
          </button>
        </form>
      </div>
    </div>
    <p class="text-center text-muted small mt-3">
      Las credenciales se validan contra Active Directory.<br>
      No se almacena ninguna contraseña.
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
